name: Atualizar com dados do TSE

on:
  schedule:
    - cron: "7 * * * *"        # uma vez por hora (horário UTC)
  workflow_dispatch:            # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atualizar
  cancel-in-progress: false

env:
  PROJETO_CLOUDFLARE: quem-senta-onde

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # só para salvar os dados do TSE no repositório
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Guardar arquivos grandes do TSE entre execuções
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: tse-dados-abertos-v1

      - name: Baixar resultados oficiais do TSE
        run: python scripts/atualizar_tse.py

      - name: Ver se os dados mudaram
        id: mudou
        run: |
          git add site/data
          if [ -d site/fotos ]; then git add site/fotos; fi
          if git diff --cached --quiet -- site/data site/fotos ':!site/data/meta.json'; then
            echo "sim=nao" >> "$GITHUB_OUTPUT"
            echo "Nada mudou no TSE desde a última vez; não publica."
          else
            echo "sim=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Salvar dados no repositório
        if: steps.mudou.outputs.sim == 'sim'
        run: |
          git config user.name "robo-tse"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Dados do TSE $(date -u +'%d/%m %H:%M') UTC"
          git push

      # Publica quando os dados mudaram ou quando alguém alterou o site (push / botão manual).
      - name: Criar o projeto no Cloudflare (só na primeira vez)
        if: steps.mudou.outputs.sim == 'sim' || github.event_name != 'schedule'
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJETO_CLOUDFLARE }} --production-branch=main

      - name: Publicar no Cloudflare Pages
        if: steps.mudou.outputs.sim == 'sim' || github.event_name != 'schedule'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.PROJETO_CLOUDFLARE }} --branch=main --commit-dirty=true
